# Runs the SuperSync server (Super Productivity's own sync backend) using the
# image built by build.sh, instead of upstream's private
# ghcr.io/super-productivity/supersync image.
#
# Usage:
#   1. cp .env.example .env   (fill in JWT_SECRET, POSTGRES_PASSWORD, PUBLIC_URL, DOMAIN, SMTP_*)
#   2. docker compose up -d
#
# This is a trimmed-down compose file (no Caddy/TLS termination) — put this
# behind your own reverse proxy, or add a caddy service like upstream's
# packages/super-sync-server/docker-compose.yml if you want it self-contained.

services:
  supersync:
    image: ${SUPERSYNC_IMAGE:-webstas/supersync:latest}
    container_name: supersync-server
    restart: unless-stopped
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=1900
      - HOST=${HOST:-0.0.0.0}
      - DATABASE_URL=${DATABASE_URL:-postgresql://${POSTGRES_USER:-supersync}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-supersync}?connection_limit=60&pool_timeout=10}
      - RUN_MIGRATIONS_ON_STARTUP=${RUN_MIGRATIONS_ON_STARTUP:-true}
      - REQUIRE_DATABASE_POOL_LIMITS=true
      - JWT_SECRET=${JWT_SECRET}
      - PUBLIC_URL=${PUBLIC_URL:-http://localhost:1900}
      - CORS_ORIGINS=${CORS_ORIGINS:-https://app.super-productivity.com}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - WEBAUTHN_RP_ID=${WEBAUTHN_RP_ID:-localhost}
      - WEBAUTHN_ORIGIN=${WEBAUTHN_ORIGIN:-http://localhost:1900}
      - ALLOWED_EMAILS=${ALLOWED_EMAILS:-}
      - SUPERSYNC_DEFAULT_STORAGE_QUOTA_BYTES=${SUPERSYNC_DEFAULT_STORAGE_QUOTA_BYTES:-}
      # Sync rate limits — this image reads them at startup (upstream hardcodes
      # them). Empty = upstream default (100/min upload, 500/15min global per-IP).
      - SYNC_UPLOAD_RATE_LIMIT_MAX=${SYNC_UPLOAD_RATE_LIMIT_MAX:-}
      - SYNC_GLOBAL_RATE_LIMIT_MAX=${SYNC_GLOBAL_RATE_LIMIT_MAX:-}
    ports:
      - '1900:1900'
    volumes:
      - supersync-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:1900/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 768m

  postgres:
    image: postgres:16-alpine
    container_name: supersync-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-supersync}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-supersync}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - >
          pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" &&
          psql -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -c "SELECT 1" > /dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    mem_limit: 1536m

volumes:
  supersync-data:
  postgres-data:
